# Local guardrails mirroring .github/workflows/ci.yml.
# Keep the ruff rev equal to the ruff version in uv.lock.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy wappa
        entry: uv run mypy wappa
        language: system
        types: [python]
        pass_filenames: false
