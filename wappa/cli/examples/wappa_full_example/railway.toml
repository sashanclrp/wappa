# ================================================================
# RAILWAY CONFIGURATION FOR WAPPA FULL EXAMPLE
# ================================================================

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# ================================================================
# RAILWAY ENVIRONMENT VARIABLES (Set via Railway Dashboard)
# ================================================================
# Required variables to set in Railway:
#
# META_APP_SECRET=your_meta_app_secret        (authenticates every webhook POST)
# META_WEBHOOK_VERIFY_TOKEN=your_verify_token   (Meta's GET challenge only)
# META_WHATSAPP_ACCESS_TOKEN=your_whatsapp_access_token
# META_WHATSAPP_PHONE_NUMBER_ID=your_phone_number_id
# META_WHATSAPP_BUSINESS_ACCOUNT_ID=your_business_id
# REDIS_URL=redis://redis.railway.internal:6379
# LLM_PROVIDER_OPENAI_API_KEY=your_openai_key (optional)
#
# Railway automatically sets:
# PORT (dynamic port assignment)
# RAILWAY_ENVIRONMENT (production/staging)
# ================================================================